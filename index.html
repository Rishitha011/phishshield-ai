<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishShield AI — Real-Time Phishing & Scam Detector</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 680px; width: 100%; background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    input, textarea { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; margin-bottom: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 0.85rem; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .result { margin-top: 1.5rem; padding: 1.25rem; border-radius: 8px; display: none; }
    .safe { background: rgba(22, 163, 74, 0.15); border: 1px solid #16a34a; }
    .warn { background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; }
    .danger { background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; }
    ul { margin: 0.5rem 0 0 1.2rem; padding: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ PhishShield AI</h1>
    <p class="subtitle">AI-powered URL & social-engineering threat analyzer built for small businesses and everyday users.</p>

    <label for="url">Suspicious URL</label>
    <input type="text" id="url" placeholder="e.g., http://secure-login-verify-bank.com" />

    <label for="message">Email or Message Text (Optional)</label>
    <textarea id="message" rows="4" placeholder="Paste the suspicious email, SMS, or WhatsApp text here..."></textarea>

    <button onclick="runScan()">Analyze Threat</button>

    <div id="resultBox" class="result"></div>
  </div>

  <script>
    function runScan() {
      const url = document.getElementById('url').value.trim();
      const text = document.getElementById('message').value.trim();
      if (!url && !text) return alert("Please enter a URL or message text to scan.");

      let score = 0;
      let flags = [];

      const keywords = ["login", "verify", "update", "secure", "account", "banking", "signin", "wallet"];
      if (keywords.some(k => url.toLowerCase().includes(k))) {
        score += 30;
        flags.push("URL contains sensitive credential-harvesting keywords.");
      }
      if (url.includes("@")) {
        score += 40;
        flags.push("URL contains an '@' symbol used to obscure the true destination.");
      }
      if (/http:\/\/\d+\.\d+\.\d+\.\d+/.test(url)) {
        score += 45;
        flags.push("URL uses a raw IP address instead of a verified domain name.");
      }
      const urgency = ["immediate", "urgent", "suspend", "action required", "click here", "verify now", "blocked"];
      if (urgency.some(w => text.toLowerCase().includes(w))) {
        score += 30;
        flags.push("Message uses high-pressure psychological urgency triggers.");
      }

      score = Math.min(score, 100);
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      box.className = 'result ' + (score >= 50 ? 'danger' : score > 0 ? 'warn' : 'safe');

      const verdict = score >= 50 ? 'High Risk — Phishing Detected' : score > 0 ? 'Suspicious — Proceed with Caution' : 'Low Risk — No Immediate Threats Flagged';
      box.innerHTML = `<strong>${verdict} (Risk Score: ${score}/100)</strong>` +
        (flags.length ? `<ul>${flags.map(f => `<li>${f}</li>`).join('')}</ul>` : `<p style="margin:0.5rem 0 0;">No common phishing patterns or urgency triggers found.</p>`);
    }
  </script>
</body>
</html>
